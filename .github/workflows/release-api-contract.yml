name: Release api-contract

# Publishes packages/api-contract to npm with provenance when a tag like
# `api-contract-v0.1.0` is pushed. The tag must match the package version and
# point at a commit on main.
#
# Authentication uses npm trusted publishing: npm accepts this workflow's OIDC
# token because the package is configured to trust this repository, workflow
# file and environment. No npm token is stored anywhere.

on:
  push:
    tags: ['api-contract-v*']

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Part of the trusted-publisher match on npm; add required reviewers there
    # to gate releases.
    environment: npm
    permissions:
      contents: read
      id-token: write # trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check tag against version and main
        run: |
          version="$(node -p "require('./packages/api-contract/package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "api-contract-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} does not point at a commit on main"
            exit 1
          fi

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # No registry-url: it would write an .npmrc expecting a token.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # apps/report imports the workspace packages' built types.
      - run: pnpm build

      - run: pnpm typecheck

      # The contract has no browser tests, so there is no Playwright setup here.
      - run: pnpm test:node

      # Trusted publishing needs npm 11.5 or later; Node 22 ships npm 10.
      - name: Install npm 11
        run: npm install --global npm@11.21.0

      - name: Publish to npm
        working-directory: packages/api-contract
        run: npm publish --provenance --access public
