name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    # A normal run takes about a minute; a hung download should fail, not block.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm build

      - run: pnpm test:node

      # Headless tests only need Chromium's headless shell, not the full
      # browser, and far fewer system packages.
      - name: Read Playwright version
        id: playwright
        run: echo "version=$(pnpm --filter @whistledoor/crypto exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium headless shell
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-headless-shell

      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 3
        run: pnpm --filter @whistledoor/crypto exec playwright install --only-shell chromium

      - name: Install system packages for the headless shell
        timeout-minutes: 5
        run: pnpm --filter @whistledoor/crypto exec playwright install-deps chromium-headless-shell

      - run: pnpm test:browser
